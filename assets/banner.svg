<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .card-detail {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .orbit-dot {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 140px; opacity: 0.15; }
      100% { r: 180px; opacity: 0.28; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Mesh Spheres in Background (Never hides foreground) -->
  <g opacity="0.6">
    <circle cx="150" cy="80" r="160" fill="#38bdf8" filter="url(#glow)" class="pulse-circle" />
    <circle cx="1050" cy="340" r="180" fill="#818cf8" filter="url(#glow)" class="pulse-circle" />
    <circle cx="980" cy="80" r="130" fill="#c084fc" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Animated DNS Data Pulse Line in Background -->
  <g opacity="0.25">
    <path d="M 0 310 Q 300 260 600 310 T 1200 310" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8,6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M 0 330 Q 300 380 600 330 T 1200 330" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(60, 48)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 0)">
      <rect width="275" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="21" class="badge-text">🌐 DOMAIN REGISTRATION &amp; DNS</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text class="title-text">
        Awesome <tspan fill="url(#accentGrad)">Domain &amp; DNS Management</tspan> ⚡
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 118)">
      <text class="subtitle-text">
        Curated SaaS Platforms, Authoritative DNS, Registrar Protocols &amp; GitOps Tooling
      </text>
    </g>

    <!-- Feature Cards Row (Foreground Highlights) -->
    <g transform="translate(0, 165)">
      <!-- Card 1: Domain Registrars -->
      <g transform="translate(0, 0)" class="orbit-dot">
        <rect width="250" height="92" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <rect x="0" y="0" width="4" height="92" rx="2" fill="#38bdf8" />
        <text x="20" y="32" class="card-title">🏢 Domain Registrars</text>
        <text x="20" y="54" class="card-detail">At-cost ICANN registrars,</text>
        <text x="20" y="72" class="card-detail">wholesale pricing &amp; WHOIS privacy</text>
      </g>

      <!-- Card 2: Authoritative DNS -->
      <g transform="translate(275, 0)">
        <rect width="250" height="92" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <rect x="0" y="0" width="4" height="92" rx="2" fill="#818cf8" />
        <text x="20" y="32" class="card-title">⚡ Authoritative DNS</text>
        <text x="20" y="54" class="card-detail">Global Anycast network,</text>
        <text x="20" y="72" class="card-detail">DNSSEC &amp; sub-millisecond propagation</text>
      </g>

      <!-- Card 3: DNS as Code / GitOps -->
      <g transform="translate(550, 0)" class="orbit-dot">
        <rect width="250" height="92" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <rect x="0" y="0" width="4" height="92" rx="2" fill="#c084fc" />
        <text x="20" y="32" class="card-title">🛠️ DNS-as-Code &amp; IaC</text>
        <text x="20" y="54" class="card-detail">DNSControl, OctoDNS, Terraform</text>
        <text x="20" y="72" class="card-detail">&amp; Git-driven multi-provider sync</text>
      </g>

      <!-- Card 4: Open Source Servers -->
      <g transform="translate(825, 0)">
        <rect width="255" height="92" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <rect x="0" y="0" width="4" height="92" rx="2" fill="#34d399" />
        <text x="20" y="32" class="card-title">🔓 Self-Hosted &amp; Open Source</text>
        <text x="20" y="54" class="card-detail">CoreDNS, PowerDNS, Technitium</text>
        <text x="20" y="72" class="card-detail">&amp; ICANN EPP registrar backends</text>
      </g>
    </g>

    <!-- Bottom Tagline Pill -->
    <g transform="translate(0, 285)">
      <rect width="460" height="28" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="18" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
        ✨ 100% Free &amp; Open Community Resource • Verified Pricing &amp; Metrics
      </text>
    </g>

  </g>
</svg>